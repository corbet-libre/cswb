[package]
name = "cswb"
version = "0.1.0"
edition = "2024"
publish = false
description = "Switchboard for the volatile forum"
repository = "https://git.corbet.ch/corbet-foss/cswb"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"

[dependencies]
cmmr = { git = "https://git.corbet.ch/corbet-foss/cmmr", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
cvlk = { git = "https://git.corbet.ch/corbet-foss/cvlk", branch = "main" }
redis = { version = "1", default-features = false, features = ["tokio-comp", "script"] }
