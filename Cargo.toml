[package]
name = "cswb"
version = "0.1.0"
edition = "2024"
publish = false
description = "Switchboard for the volatile forum"
repository = "https://git.corbet.ch/corbet-foss/cswb.git"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"

[dependencies]
cmmr = { git = "https://git.corbet.ch/corbet-foss/cmmr.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
cpfl = { git = "https://git.corbet.ch/corbet-foss/cpfl.git", branch = "main" }
cchr = { git = "https://git.corbet.ch/corbet-foss/cchr.git", branch = "main" }
crbk = { git = "https://git.corbet.ch/corbet-foss/crbk", branch = "main", default-features = false }
cshm = { git = "https://git.corbet.ch/corbet-foss/cshm", branch = "main" }
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
sha2 = "0.11"
url = "2"

[dev-dependencies]
cnvl = { git = "https://git.corbet.ch/corbet-foss/cnvl.git", branch = "main" }
cgrd = { git = "https://git.corbet.ch/corbet-foss/cgrd", branch = "main", default-features = false }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }
ckmg = { git = "https://git.corbet.ch/corbet-foss/ckmg.git", branch = "main" }
cwst = { git = "https://git.corbet.ch/corbet-foss/cwst.git", branch = "main" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
cvlk = { git = "https://git.corbet.ch/corbet-foss/cvlk.git", branch = "main" }
redis = { version = "1", default-features = false, features = ["tokio-comp", "script"] }
